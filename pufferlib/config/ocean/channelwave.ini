[base]
env_name = puffer_channelwave
package = ocean
policy_name = ChannelWave
rnn_name = ChannelWaveLSTM

# ============================================================================
# ChannelWave: Phase-Locking & Entrainment Experiments
# ============================================================================
#
# Arnold Tongue Sweep: Testing phase-locking at different frequencies
#
# Key parameters:
#   T_c = t_m = 10 (critical period = movement cooldown)
#   T = default_period (square wave period)
#
# Theoretical prediction:
#   T < 2*T_c (T < 20): Impossible - can't make round trip
#   T = 2*T_c (T = 20): Critical - requires perfect timing  
#   T > 2*T_c (T > 20): Possible - easier as T increases
#
# ============================================================================

[vec]
backend = Serial
num_envs = 1
batch_size = auto

[env]
num_instances = 1024
channels_per_instance = 1
agents_per_instance = 1
max_steps = 500
default_period = 40
t_m = 10
heart_reward = 1.0
move_penalty = 0.0
reward_mode = discrete
spawn_mode = deterministic

[train]
device = cuda
total_timesteps = 50_000_000
learning_rate = 3e-4
batch_size = 131072
minibatch_size = 16384
bptt_horizon = 128
update_epochs = 4
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
vf_coef = 0.5
max_grad_norm = 0.5
ent_coef = 0.01
anneal_lr = True
checkpoint_interval = 100

[sweep]
metric = hearts_collected
goal = maximize

# ============================================================================
# SWEEP: Period sweep across difficulty regimes
# ============================================================================
# With T_c = 10:
#   T=12: Very hard (T = 1.2 * T_c) - barely possible
#   T=16: Hard (T = 1.6 * T_c)
#   T=20: Critical boundary (T = 2 * T_c)
#   T=30: Medium (T = 3 * T_c)
#   T=40: Easy (T = 4 * T_c) - baseline
#   T=60: Very easy (T = 6 * T_c)
#   T=80: Trivial (T = 8 * T_c)
# ============================================================================

[sweep.train.total_timesteps]
distribution = fixed
values = [50_000_000]

[sweep.env.default_period]
distribution = categorical
values = [12, 14, 16, 18, 20, 24, 28, 32, 40, 50, 60, 80]
