[base]
env_name = puffer_channelwave
package = ocean
policy_name = ChannelWave
rnn_name = ChannelWaveLSTM

# ============================================================================
# ChannelWave: Phase-Locking & Entrainment Experiments
# ============================================================================
#
# This environment studies how RL agents synchronize with periodic reward
# patterns - a fundamental question connecting to biological oscillators,
# foraging theory, and the Arnold Tongue framework from dynamical systems.
#
# Key parameters:
#   T_c = t_m (critical period = movement cooldown)
#   T = period (square wave reward period)
#   L = max_steps (episode length)
#
# Regimes:
#   T >> T_c : Easy - agent has plenty of time to switch
#   T ≈ 2*T_c : Medium - requires good timing
#   T ≈ T_c : Hard - nearly impossible to catch all rewards
#   T < T_c : Impossible - synchronization is physically impossible
#
# ============================================================================

# Training hyperparameters
total_timesteps = 50_000_000
learning_rate = 3e-4
batch_size = 32768
minibatch_size = 2048
bptt_horizon = 32
update_epochs = 4
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
vf_coef = 0.5
ent_coef = 0.01
max_grad_norm = 0.5
anneal_lr = true

# LSTM settings (critical for learning periodic patterns)
use_rnn = true

# Environment settings
num_envs = 128

# Device
device = cuda

# Environment defaults
env.num_channels = 1
env.num_agents = 1
env.max_steps = 500
env.default_period = 40
env.default_produce = 20
env.t_m = 10
env.heart_reward = 1.0
env.move_penalty = 0.0
env.reward_mode = discrete
env.spawn_mode = deterministic

# ============================================================================
# EXPERIMENT PRESETS
# ============================================================================

[easy]
# Easy period: T = 40, T_c = 10 (T = 4 * T_c)
# Agent has plenty of time to switch between positions
env.default_period = 40
env.t_m = 10
total_timesteps = 20_000_000

[medium]
# Medium period: T = 20, T_c = 10 (T = 2 * T_c)
# Agent must be reasonably efficient
env.default_period = 20
env.t_m = 10
total_timesteps = 50_000_000

[hard]
# Hard period: T = 12, T_c = 10 (T = 1.2 * T_c)
# Very tight timing required - tests phase-locking limits
env.default_period = 12
env.t_m = 10
total_timesteps = 100_000_000

[critical]
# At critical period: T = 10, T_c = 10 (T = T_c)
# Theoretical limit - agent cannot collect all rewards
env.default_period = 10
env.t_m = 10
total_timesteps = 50_000_000

[continuous]
# Continuous reward mode - reward every tick at correct position
# Changes optimal strategy (staying is rewarded, not just arriving)
env.reward_mode = continuous
env.default_period = 40
env.t_m = 10
total_timesteps = 50_000_000

[two_channel]
# Two-channel setup for Arnold Tongue experiments
# Independent frequencies allow studying frequency ratios
env.num_channels = 2
env.spawn_mode = independent
env.channel_periods = [40, 40]
env.channel_phases = [0, 20]
total_timesteps = 50_000_000

[multi_agent]
# Multi-agent competition/cooperation
# Tests strategic interactions from the document
env.num_agents = 4
env.num_channels = 4
env.spawn_mode = independent
total_timesteps = 100_000_000

# ============================================================================
# SWEEP CONFIGURATIONS
# ============================================================================
# For Arnold Tongue analysis: sweep across periods and measure learning

[sweep.metric]
name = hearts_collected
goal = maximize

[sweep.train.total_timesteps]
distribution = fixed
values = [50_000_000]

# ============================================================================
# Single-Channel Period Sweep (Primary Experiment)
# ============================================================================
# Tests the critical period hypothesis: learning should fail when T < T_c
# and difficulty should increase as T approaches T_c from above

[sweep.env.default_period]
distribution = linear
min = 8
max = 80
num = 19

[sweep.env.t_m]
distribution = fixed
values = [10]

