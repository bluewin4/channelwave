[base]
env_name = puffer_channelwave
package = ocean
policy_name = ChannelWave
rnn_name = ChannelWaveLSTM

# ============================================================================
# ChannelWave: Phase-Locking & Entrainment Experiments
# ============================================================================
#
# RTX 3080 Ti (12GB VRAM) optimized settings
#
# Key parameters:
#   T_c = t_m (critical period = movement cooldown)
#   T = period (square wave reward period)
#
# Default: T=40, T_c=10 (easy regime, T = 4*T_c)
#
# ============================================================================

[vec]
backend = Serial
num_envs = 1
batch_size = auto

[env]
num_instances = 128
channels_per_instance = 1
agents_per_instance = 1
max_steps = 500
default_period = 40
default_produce = 20
t_m = 10
heart_reward = 1.0
move_penalty = 0.0
reward_mode = discrete
spawn_mode = deterministic

[train]
device = cuda
total_timesteps = 100_000_000
learning_rate = 3e-4
batch_size = 32768
minibatch_size = 4096
bptt_horizon = 128
update_epochs = 4
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
vf_coef = 0.5
max_grad_norm = 0.5
ent_coef = 0.01
anneal_lr = True
checkpoint_interval = 100

[sweep]
metric = hearts_collected
goal = maximize

# ============================================================================
# SWEEP: Period sweep for Arnold Tongue primary experiment
# ============================================================================

[sweep.train.total_timesteps]
distribution = fixed
values = [100_000_000]

[sweep.env.default_period]
distribution = linear
min = 8
max = 80
num = 19
