[base]
env_name = puffer_channelwave
package = ocean
policy_name = ChannelWave
rnn_name = ChannelWaveLSTM

# ============================================================================
# ChannelWave: Phase-Locking & Entrainment Experiments
# ============================================================================
#
# This environment studies how RL agents synchronize with periodic reward
# patterns - connecting RL to biological oscillators, foraging theory, 
# and the Arnold Tongue framework from dynamical systems.
#
# Key parameters:
#   T_c = t_m (critical period = movement cooldown)
#   T = period (square wave reward period)
#   L = max_steps (episode length)
#
# Regimes:
#   T >> T_c : Easy - agent has plenty of time to switch
#   T ≈ 2*T_c : Medium - requires good timing
#   T ≈ T_c : Hard - nearly impossible to catch all rewards
#   T < T_c : Impossible - synchronization is physically impossible
#
# ============================================================================

[vec]
num_envs = 128

[env]
num_channels = 1
num_agents = 1
max_steps = 500
default_period = 40
default_produce = 20
t_m = 10
heart_reward = 1.0
move_penalty = 0.0
reward_mode = discrete
spawn_mode = deterministic

[train]
device = cuda
total_timesteps = 50_000_000
learning_rate = 3e-4
batch_size = 32768
minibatch_size = 2048
bptt_horizon = 32
update_epochs = 4
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
vf_coef = 0.5
max_grad_norm = 0.5
ent_coef = 0.01
anneal_lr = True

[sweep]
metric = hearts_collected
goal = maximize

# ============================================================================
# SWEEP: Single-Channel Period Sweep (Primary Experiment)
# ============================================================================
# Tests the critical period hypothesis: learning fails when T < T_c

[sweep.train.total_timesteps]
distribution = fixed
values = [50_000_000]

[sweep.env.default_period]
distribution = linear
min = 8
max = 80
num = 19
