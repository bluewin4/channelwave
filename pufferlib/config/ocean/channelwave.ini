[base]
env_name = puffer_channelwave
package = ocean
policy_name = ChannelWave
rnn_name = ChannelWaveLSTM

# ChannelWave Phase-Locking Experiments
# 
# Key parameters from the document:
# - T_c = t_m (critical period = movement time)
# - T = period (square wave period)
# - L = max_steps (episode length)
#
# Easy regime: T >> T_c (e.g., T=40, T_c=10 → T=4*T_c)
# Hard regime: T ≈ T_c (e.g., T=15, T_c=10 → T=1.5*T_c)
# Impossible: T < T_c

# Training hyperparameters
total_timesteps = 10_000_000
learning_rate = 3e-4
batch_size = 8192
minibatch_size = 512
bptt_horizon = 16
update_epochs = 4
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
vf_coef = 0.5
ent_coef = 0.01
max_grad_norm = 0.5
anneal_lr = true

# LSTM settings
use_rnn = true

# Environment settings
num_envs = 32

# Device (cpu for mac, cuda for gpu)
device = cpu

[easy]
# Easy period: T = 40, T_c = 10 (T = 4 * T_c)
# Agent has plenty of time to switch
env.period = 40
env.distance = 10
env.max_steps = 500
total_timesteps = 5_000_000

[medium]  
# Medium period: T = 20, T_c = 10 (T = 2 * T_c)
# Agent can just make it with good timing
env.period = 20
env.distance = 10
env.max_steps = 500
total_timesteps = 10_000_000

[hard]
# Hard period: T = 12, T_c = 10 (T = 1.2 * T_c)
# Very tight timing required
env.period = 12
env.distance = 10
env.max_steps = 500
total_timesteps = 20_000_000

[critical]
# At critical period: T = 10, T_c = 10 (T = T_c)
# Theoretically impossible to sync perfectly
env.period = 10
env.distance = 10
env.max_steps = 500
total_timesteps = 10_000_000

[continuous_reward]
# Continuous reward mode - reward every tick at correct position
# Changes the optimal strategy
env.reward_mode = continuous
env.period = 40
env.distance = 10
total_timesteps = 10_000_000
